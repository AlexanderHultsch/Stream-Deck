<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Edit buttons – Stream Deck</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0b0d10;
  --card: #161a20;
  --border: #232830;
  --text: #e8ecf1;
  --muted: #8a93a0;
  --ok: #2ecc71;
  --error: #ff5d5d;
  --accent: #1e90ff;
  --field: #0f1216;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  padding: 32px 16px 64px;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.4;
}

main {
  max-width: 860px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 700;
}

.muted {
  color: var(--muted);
}

.lead {
  margin: 0 0 24px;
}

#list {
  display: grid;
  gap: 14px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.empty {
  padding: 32px 8px;
  text-align: center;
}

.card {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  gap: 20px;
  padding: 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
}

.slot-title {
  grid-column: 1 / -1;
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.card.slot-empty {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  padding: 10px 18px;
  background: transparent;
  border-style: dashed;
}

.slot-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
}

.slot-empty .actions {
  padding-top: 0;
}

.side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.icon {
  display: block;
  width: 56px;
  height: 56px;
  object-fit: contain;
  border-radius: 10px;
}

.icon-ph {
  background: var(--field);
  border: 1px dashed var(--border);
}

.id {
  max-width: 100%;
  font-size: 12px;
  text-align: center;
  overflow-wrap: anywhere;
}

.id code {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: var(--text);
}

.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 16px;
  min-width: 0;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field.wide {
  grid-column: 1 / -1;
}

label {
  font-size: 13px;
  font-weight: 600;
}

.help {
  font-size: 12px;
}

input,
select {
  width: 100%;
  min-width: 0;
  padding: 9px 11px;
  background: var(--field);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
}

input::placeholder {
  color: var(--muted);
  opacity: .7;
}

input:hover,
select:hover {
  border-color: #343b46;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.actions {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 4px;
}

.btn {
  padding: 8px 14px;
  background: var(--card);
  color: var(--text);
  border: 1px solid #343b46;
  border-radius: 8px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

.btn:hover:not(:disabled) {
  background: #1d222a;
}

.btn:disabled {
  opacity: .4;
  cursor: default;
}

.btn.danger:hover:not(:disabled) {
  color: var(--error);
  border-color: var(--error);
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #04111f;
}

.btn.primary:hover:not(:disabled) {
  background: #3ea0ff;
}

.footer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 14px;
  margin-top: 20px;
}

#dirty {
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
}

#status {
  flex: 1 0 100%;
  min-height: 1.4em;
  margin: 0;
  font-weight: 600;
}

#status.ok {
  color: var(--ok);
}

#status.err {
  color: var(--error);
}

[hidden] {
  display: none !important;
}

@media (max-width: 640px) {
  body {
    padding: 20px 16px 48px;
  }

  .card {
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 14px;
  }

  .side {
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
  }

  .id {
    text-align: left;
  }

  .fields {
    grid-template-columns: 1fr;
  }

  .actions {
    justify-content: flex-start;
  }
}
</style>
<script src="/edit.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>Edit buttons</h1>
    <p class="lead muted">Only available on this PC (localhost). 8 slots. Empty slots appear as blank tiles on the phone. Changes apply to the phone page on its next refresh.</p>
  </header>
  <ol id="list" aria-label="Slots"></ol>
  <div class="footer">
    <button type="button" class="btn primary" id="save" disabled>Save</button>
    <span id="dirty" hidden>Unsaved changes</span>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
</main>
</body>
</html>
